<script>
const S=[...document.querySelectorAll('section.sl')];let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1));
function show(){S.forEach((s,j)=>s.classList.toggle('on',j===i));document.getElementById('nav').textContent=(i+1)+' / '+S.length;history.replaceState(null,'','#'+(i+1));
 for(const k of [i+1,i+2]){if(S[k])S[k].querySelector('img').loading='eager'}}
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){i=Math.min(S.length-1,i+1);show()}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){i=Math.max(0,i-1);show()}else if(e.key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}else if(e.key==='Home'){i=0;show()}else if(e.key==='End'){i=S.length-1;show()}});
addEventListener('click',e=>{if(e.target.closest('a'))return;i=e.clientX>innerWidth/3?Math.min(S.length-1,i+1):Math.max(0,i-1);show()});
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n){i=Math.max(0,Math.min(S.length-1,n-1));show()}});
show();
</script></body></html>
